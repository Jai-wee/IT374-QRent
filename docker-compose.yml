version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: qrent-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: qrent_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./qrent-backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./qrent-backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  qrent-api:
    build:
      context: ./qrent-backend
      dockerfile: Dockerfile
    container_name: qrent-backend-api
    restart: always
    depends_on:
      - postgres-db
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_USER: postgres
      DB_PASSWORD: password123
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: qrent_db
      JWT_SECRET: supersecretkey_qrent_2026_jwt_token_secret

volumes:
  pgdata:
